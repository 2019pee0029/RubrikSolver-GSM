<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubik GSM 3D Viewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="toolbar">
        <button data-move="U">U</button>
        <button data-move="D">D</button>
        <button data-move="L">L</button>
        <button data-move="R">R</button>
        <button data-move="F">F</button>
        <button data-move="B">B</button>
        <button data-move="U'">U'</button>
        <button data-move="D'">D'</button>
        <button data-move="L'">L'</button>
        <button data-move="R'">R'</button>
        <button data-move="F'">F'</button>
        <button data-move="B'">B'</button>
        <button id="scrambleBtn" type="button" aria-label="Generate a 30-move random scramble">Scramble</button>
        <button id="resetBtn">Reset</button>
      </div>

      <div class="viewer-layout">
        <div id="cubeContainer">
          <div class="scene" id="scene">
            <div class="cube" id="cube"></div>
          </div>
        </div>

        <aside class="solver-panel" aria-labelledby="solverTitle">
          <div class="solver-heading">
            <h1 id="solverTitle">Solution</h1>
            <span id="solutionCount">0 moves</span>
          </div>
          <p id="solverStatus" role="status" aria-live="polite">Scramble the cube, then find a solution.</p>
          <button id="solveBtn" class="solver-primary" type="button">Find solution</button>
          <div class="solution-actions">
            <button id="nextStepBtn" type="button" disabled>Next move</button>
            <button id="playSolutionBtn" type="button" disabled>Play all</button>
          </div>
          <ol id="solutionSteps" class="solution-steps" aria-label="Solution moves"></ol>
          <p class="solver-note">Native GSM two-phase solver: short solutions, not guaranteed globally shortest.</p>
        </aside>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
