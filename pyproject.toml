[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubrik-solver-gsm"
version = "0.1.0"
description = "A Python Rubik's Cube Group-State Matrix engine and solver scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AIJAZ" }]
license = { text = "MIT" }
keywords = ["rubiks-cube", "gsm", "algorithm", "python"]

[tool.setuptools]
py-modules = ["main"]
